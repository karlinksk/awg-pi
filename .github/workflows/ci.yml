name: v1.1.0 CI

on:
  push:
    branches:
      - 'develop/v1.1.0'
  pull_request:
    branches:
      - main
      - 'develop/v1.1.0'

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables
      - name: Bash syntax
        run: |
          bash -n install.sh
          bash -n src/awg-common
          bash -n src/awg-route
          bash -n src/awg-opencck-update
          bash -n src/awg-core-update
          bash -n src/awg-update
          bash -n src/awg-menu
          bash -n tests/test-common.sh
          bash -n tests/test-opencck-updater.sh
          bash -n tests/mock-curl.sh
          bash -n tests/test-nft-template.sh
          bash -n tests/test-rc2.sh
      - name: ShellCheck errors
        run: |
          shellcheck -S error install.sh src/awg-common src/awg-route src/awg-opencck-update src/awg-core-update src/awg-update src/awg-menu tests/test-common.sh tests/test-opencck-updater.sh tests/mock-curl.sh tests/test-nft-template.sh
      - name: Unit tests
        run: |
          bash tests/test-common.sh
          bash tests/test-opencck-updater.sh
          bash tests/test-nft-template.sh
          bash tests/test-rc2.sh
          python3 tests/test-maintenance.py
